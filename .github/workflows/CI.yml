name: CI

on:
  push:
    branches:
      - feature/create_2
  pull_request:
    branches:
      - feature/create_2

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Django check
        run: poetry run python manage.py check

      - name: Run tests
        run: poetry run python manage.py test chat
