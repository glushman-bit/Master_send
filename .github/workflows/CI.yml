name: CI

on:
  push:
    branches:
      - feature/create_2
  pull_request:
    branches:
      - feature/create_2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install flake8
        run: |
          python -m pip install --update pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: "*"
      SECURE_SSL_REDIRECT: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Django check
        run: poetry run python manage.py check

      - name: Run tests
        run: poetry run python manage.py test about contacts core orders portfolio prices services users
