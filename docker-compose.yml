services:
  web:
    image: glushman/master_send:${IMAGE_TAG}
    container_name: master_send_web
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5


  db:
    image: postgres:16-alpine
    container_name: master_send_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot-www:/var/www/certbot:ro
      - ./certbot:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy

  # Выпуск/обновление сертификатов (раскомментировать после запуска HTTP на сервере):
  certbot:
   image: certbot/certbot
   restart: unless-stopped
   volumes:
     - ./certbot:/etc/letsencrypt
     - certbot-www:/var/www/certbot
   entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  pg_data:
  static_volume:
  media_volume:
  certbot-www: