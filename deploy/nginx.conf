# Прокси-конфиг Nginx для docker-compose.
# Замените master-send.ru / www.master-send.ru на свой домен и
# добавьте его в ALLOWED_HOSTS и CSRF_TRUSTED_ORIGINS (.env).

upstream master_send {
    server web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name master-send.ru www.master-send.ru;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://master_send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

