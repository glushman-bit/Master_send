events {}

http {

    include /etc/nginx/mime.types;

    upstream web {
        server web:8000;
    }

    server {
        listen 80;

        server_name test-pysam.online www.test-pysam.online;       # Имя домена

        location /.well-known/acme-challenge/ {            # место для обновления сертификата
            root /var/www/certbot;
        }

        location / {
            return 301 https://test-pysam.online$request_uri;       # перенаправление с http на https
        }
    }

    server {
        listen 443 ssl;

        server_name test-pysam.online;

        ssl_certificate /etc/letsencrypt/live/test-pysam.online/fullchain.pem;           # сертификат
        ssl_certificate_key /etc/letsencrypt/live/test-pysam.online/privkey.pem;      # сертификат

        client_max_body_size 20M;

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        location /ws/ {
            proxy_pass http://web;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://web;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}